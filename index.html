<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Christadelphian classes — transcript search (index demo)</title>
<link href="pagefind/pagefind-ui.css" rel="stylesheet"><style>body{font-family:system-ui;max-width:56rem;margin:2rem auto;padding:0 1rem}</style></head>
<body><h1>Transcript search index</h1><p>Static Pagefind index over the class transcripts, consumed by christadelphianclasses.com. Sub-results show the time in the recording where the phrase occurs.</p>
<div id="search"></div>
<script src="pagefind/pagefind-ui.js"></script>
<script>new PagefindUI({ element: "#search", showSubResults: true, showImages: false, pageSize: 10,
  processResult: r => { r.sub_results = (r.sub_results||[]).map(s => { const m = /#t(\d+)$/.exec(s.url||""); if (m) { const t=+m[1]; s.title = (t>=3600? Math.floor(t/3600)+":"+String(Math.floor(t%3600/60)).padStart(2,"0") : Math.floor(t/60)) + ":" + String(t%60).padStart(2,"0") + " — " + r.meta.title; s.url = "https://www.christadelphianclasses.com/study/"+r.meta.study_id+"?class="+r.meta.class_id+"&t="+t; } return s; }); r.url = "https://www.christadelphianclasses.com/study/"+r.meta.study_id+"?class="+r.meta.class_id; return r; } });</script>
</body></html>
